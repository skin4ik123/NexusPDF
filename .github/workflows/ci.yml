name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch pinned tools (qpdf, tessdata, OCR models)
        shell: pwsh
        run: |
          $lock = Get-Content tools/qpdf.lock.json | ConvertFrom-Json
          ./tools/fetch-qpdf.ps1 -Version $lock.version -ExpectedSha256 $lock.sha256
          ./tools/fetch-tessdata.ps1
          ./tools/fetch-ocrmodels.ps1

      - name: Build
        run: dotnet build NexusPdf.slnx -c Release

      - name: Desktop WPF image import
        run: dotnet run --project tests/NexusPdf.DesktopImportProbe -c Release

      - name: Unit tests
        run: dotnet test tests/NexusPdf.UnitTests -c Release --no-build --logger "trx"

      - name: PDF engine tests
        run: dotnet test tests/NexusPdf.PdfEngineTests -c Release --no-build --logger "trx"

      - name: Printing tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/NexusPdf.PrintingTests -c Release --no-build --logger "trx"

      - name: Full artifact pipeline (publish + MSI + Setup + ZIP)
        shell: pwsh
        run: ./build.ps1 -All -SkipTests

      - name: Collect generated PDF fixtures on failure
        if: failure()
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'pdf-regression-fixtures'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Get-ChildItem (Join-Path $env:TEMP 'NexusPdfTests') -Filter legacy-mask.pdf -Recurse | ForEach-Object {
            $folder = Join-Path $destination $_.Directory.Name
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            Copy-Item (Join-Path $_.Directory.FullName '*.pdf') $folder
          }

      - name: Upload generated failure fixtures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexuspdf-generated-failure-fixtures
          path: ${{ runner.temp }}/pdf-regression-fixtures
          if-no-files-found: ignore
          retention-days: 7

      # Отчёты .trx создавались и раньше, но никуда не выкладывались: разбирать
      # упавший тест приходилось по сырому выводу шага.
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - uses: actions/upload-artifact@v4
        with:
          name: NexusPdf-win-x64
          path: |
            artifacts/NexusPdf.msi
            artifacts/NexusPdfSetup.exe
            artifacts/*.zip
            artifacts/checksums.sha256.txt
