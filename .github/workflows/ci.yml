name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build NexusPdf.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/NexusPdf.UnitTests -c Release --no-build --logger "trx"

      - name: PDF engine tests
        run: dotnet test tests/NexusPdf.PdfEngineTests -c Release --no-build --logger "trx"

      - name: Publish win-x64
        run: dotnet publish src/NexusPdf.App.Desktop -c Release -r win-x64 --self-contained true -o artifacts/publish/win-x64

      - name: Hashes
        shell: pwsh
        run: Get-ChildItem artifacts/publish/win-x64 -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-File artifacts/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NexusPdf-win-x64
          path: artifacts/
