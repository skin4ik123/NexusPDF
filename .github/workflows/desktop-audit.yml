name: NexusPDF functional and visual audit
on:
  push:
    branches: [codex/nexuspdf-full-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned native tools and Cyrillic OCR
        shell: pwsh
        run: |
          $lock = Get-Content tools/qpdf.lock.json | ConvertFrom-Json
          ./tools/fetch-qpdf.ps1 -Version $lock.version -ExpectedSha256 $lock.sha256
          if ($LASTEXITCODE -ne 0) { throw 'qpdf download failed' }
          ./tools/fetch-tessdata.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract download failed' }
          ./tools/fetch-ocrmodels.ps1
          if ($LASTEXITCODE -ne 0) { throw 'OCR model download failed' }
      - name: Build desktop audit probe
        run: dotnet build tests/NexusPdf.DesktopAuditProbe -c Release
      - name: Inspect actual WPF windows and bindings
        run: dotnet run --project tests/NexusPdf.DesktopAuditProbe -c Release --no-build -- artifacts/ui-audit
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexuspdf-desktop-audit
          path: artifacts/ui-audit
          if-no-files-found: warn
          retention-days: 14
