name: Verify NexusPDF 0.26 PDF fixes

on:
  push:
    branches: [codex/nexuspdf-026-fixes]
    paths: [.github/workflows/pdf-regressions.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch pinned PDF and OCR tools
        shell: pwsh
        run: |
          $lock = Get-Content tools/qpdf.lock.json | ConvertFrom-Json
          ./tools/fetch-qpdf.ps1 -Version $lock.version -ExpectedSha256 $lock.sha256
          ./tools/fetch-tessdata.ps1
          ./tools/fetch-ocrmodels.ps1

      - name: Build the solution including the desktop application
        run: dotnet build NexusPdf.slnx -c Release

      - name: Unit tests
        run: dotnet test tests/NexusPdf.UnitTests -c Release --no-build --logger "trx"

      - name: PDF engine and reported regression tests
        run: dotnet test tests/NexusPdf.PdfEngineTests -c Release --no-build --logger "trx"

      - name: Printing tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/NexusPdf.PrintingTests -c Release --no-build --logger "trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexuspdf-pdf-fix-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
          retention-days: 14
