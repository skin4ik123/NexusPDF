name: Verify PDF fixes and desktop image import

on:
  push:
    branches: [codex/nexuspdf-026-fixes]
    paths: [.github/workflows/pdf-regressions.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch pinned PDF and OCR tools
        shell: pwsh
        run: |
          $lock = Get-Content tools/qpdf.lock.json | ConvertFrom-Json
          ./tools/fetch-qpdf.ps1 -Version $lock.version -ExpectedSha256 $lock.sha256
          ./tools/fetch-tessdata.ps1
          ./tools/fetch-ocrmodels.ps1

      - name: Build the solution including the desktop application
        run: dotnet build NexusPdf.slnx -c Release

      - name: Desktop WPF image import\n        run: dotnet run --project tests/NexusPdf.DesktopImportProbe -c Release\n\n      - name: Unit tests
        run: dotnet test tests/NexusPdf.UnitTests -c Release --no-build --logger "trx"

      - name: PDF engine and reported regression tests
        run: dotnet test tests/NexusPdf.PdfEngineTests -c Release --no-build --logger "trx"

      - name: Printing tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/NexusPdf.PrintingTests -c Release --no-build --logger "trx"

      - name: Collect generated PDF fixtures on failure
        if: failure()
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'pdf-regression-fixtures'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Get-ChildItem (Join-Path $env:TEMP 'NexusPdfTests') -Filter legacy-mask.pdf -Recurse | ForEach-Object {
            $folder = Join-Path $destination $_.Directory.Name
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            Copy-Item (Join-Path $_.Directory.FullName '*.pdf') $folder
          }

      - name: Upload generated failure fixtures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexuspdf-generated-failure-fixtures
          path: ${{ runner.temp }}/pdf-regression-fixtures
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexuspdf-pdf-fix-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
          retention-days: 14
